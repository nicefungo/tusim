# TinyTU Production Configuration
# ================================
# YAML-driven parametric TU architecture.
# All hardware parameters are configurable here.
# The C model reads this via a generated header (tu_config.h).

tu:
  name: "TinyTU"
  version: "2.0-dev"

  # ---- Compute Engine ----
  compute:
    pe_array:
      rows: 16            # PE rows (output dimension)
      cols: 16            # PE columns (input dimension)
      dataflow: "weight_stationary"   # weight_stationary | output_stationary | row_stationary
      pipeline_depth: 2   # pipeline stages per PE (fetch → multiply → accumulate)

    mac_units_per_pe: 1   # MAC units per PE (for multi-issue PEs)

    supported_precisions: [fp16, fp32]
    accumulator_precision: "fp32"

    # Tiling configuration (0 = auto-compute from SRAM sizes)
    max_tile_rows: 0
    max_tile_cols: 0
    max_tile_inner: 0

  # ---- Memory System ----
  memory:
    sram:
      # Buffer sizes in KB
      w_buffer_kb: 128    # Weight buffer
      a_buffer_kb: 64     # Activation buffer
      o_buffer_kb: 64     # Output buffer

    banking:
      banks: 32           # Number of SRAM banks
      bank_width_bytes: 4 # Bytes per bank (word size)
      conflict_model: "detect"  # none | detect (log warning) | stall_cycle (model penalty)

    # Memory access costs (cycles)
    latency:
      sram_read: 1        # SRAM read latency
      sram_write: 1       # SRAM write latency
      dram_read: 50       # cycles or ns, selected by dram.latency_domain
      dram_write: 50      # cycles or ns, selected by dram.latency_domain

    # DRAM subsystem (off-chip memory)
    dram:
      type: "ideal"       # ideal | hbm2 | hbm2e | hbm3 | ddr4 | ddr5 | lpddr5 | custom
      bandwidth_gbps: 256.0
      channels: 8          # power of two required by xor_interleaved
      model_row_conflicts: false
      row_policy: "legacy"  # legacy | open_page | closed_page | adaptive_timeout
      address_mapping: "burst_interleaved"  # burst_interleaved | row_interleaved | xor_interleaved
      row_miss_penalty_cycles: 10
      row_conflict_penalty_cycles: 0  # 0 inherits miss cost; set > miss for precharge + activate
      row_open_timeout_cycles: 100  # adaptive_timeout idle threshold; ignored otherwise
      row_open_timeout_ns: 100.0  # physical-ns threshold source; ignored in core_cycles mode
      row_timeout_domain: "core_cycles"  # core_cycles (compat) | physical_ns
      latency_domain: "core_cycles"  # core_cycles (compat) | physical_ns
      core_clock_ghz: 1.0
      turnaround_mode: "none"  # none | fixed | idle_credit | burst_credit (exact bytes) | burst_round_credit (protocol-burst rounded)
      turnaround_domain: "core_cycles"  # core_cycles | physical_ns
      read_to_write_turnaround: 0.0  # cycles or ns in selected domain
      write_to_read_turnaround: 0.0  # cycles or ns in selected domain
      refresh:
        mode: "none"        # none | all_bank | per_bank
        scheduling: "fixed" # fixed | deferred (opportunistic, bounded by max_deferral_ns)
        rate: 1             # 1x | 2x | 4x refresh-rate multiplier (2x/4x for high-temp retention)
        trefi_ns: 7800      # JEDEC tREFI: per-bank average refresh interval (DDR4-like default)
        trfc_ns: 350        # JEDEC tRFC: all-bank refresh command duration
        trfc_pb_ns: 90      # DDR5-style per-bank refresh duration (used by per_bank mode)
        max_deferral_ns: 7800  # deferred-scheduling hard deadline (retention safety bound)

  # ---- DMA Engine ----
  dma:
    bus_width_bits: 256   # AXI bus width
    max_burst_bytes: 64   # Maximum burst size
    channels: 3           # Number of independent DMA channels
    max_outstanding: 4    # Maximum outstanding requests per channel
    async_mode: false     # true = async DMA with completion notification

  # ---- ISA / Command Queue ----
  isa:
    instruction_width_bits: 96
    queue_depth: 16       # Hardware command queue depth
    dependency_checking: false  # Hardware dependency tracking

  # ---- Multi-Core ----
  multicore:
    enabled: false
    num_cores: 1
    interconnect: "none"  # none | ring | mesh | crossbar
    switching: "legacy_hop_only"  # legacy_hop_only | cut_through | store_and_forward
    contention: "ideal_parallel"  # ideal_parallel | shared_link
    mesh_routing: "xy"     # xy | yx deterministic dimension order
    link_bytes_per_cycle: 16
    router_latency_cycles: 5
    cache_coherence: false

  # ---- Performance Model ----
  performance:
    cycle_model: "functional"   # functional | estimated | cycle_accurate
    counters:
      enabled: true
      detailed_stalls: false    # Track per-stall-reason counters
    tracing:
      enabled: false
      format: "none"            # none | vcd | fst
      output_file: ""

  # ---- Power Model ----
  power:
    enabled: false
    model: "none"           # none | simple (per-op energy) | detailed (per-component)
    tech_node: "auto"       # auto | 45nm | 28nm | 16nm | 7nm | 5nm | 3nm
    clock_freq_mhz: 0.0      # 0 = legacy heuristic; explicit clock does not imply voltage scaling

  # ---- Precision Parameters ----
  precision:
    fp16:
      rounding: "round_nearest_even"
      subnormal: "flush_to_zero"   # flush_to_zero | full_support
      saturate: true
    fp32:
      rounding: "round_nearest_even"
    int8:
      quantization: "symmetric"
      per_channel: false
    bf16:
      rounding: "round_nearest_even"

  # ---- Sparsity ----
  sparsity:
    enabled: false
    structured_2of4: false
    unstructured: false
    metadata_format: "bitmask"   # bitmask | csf | coordinate_list
    decoder_groups_per_cycle: 1  # packed 2:4 groups decoded per cycle

  # ---- Verification ----
  verification:
    golden_reference: "pytorch"  # pytorch | numpy | onnxruntime
    random_test_iterations: 1000
    error_tolerance: 1e-5
